<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Material Issue Form</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#eef3f8;
}

.page-container{
    width:150%;
    max-width:2000px;
    margin:40px auto;
}

.card{
    border:none;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,0.10);
}

.card-header{
    background:#003366;
    color:#fff;
    padding:18px 25px;
    font-size:40px;
    font-weight:600;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.badge-status{
    background:#28a745;
    padding:8px 15px;
    border-radius:20px;
    font-size:13px;
}

.card-body{
    padding:50px;
}

.section-title{
    background:#f0f6ff;
    border-left:5px solid #0078d7;
    padding:10px 15px;
    margin-bottom:20px;
    border-radius:8px;
    font-weight:600;
    color:#003366;
}

.form-label{
    font-weight:600;
}

.form-control,
.form-select{
    border-radius:10px;
    height:48px;
}

textarea.form-control{
    height:auto;
}

.readonly{
    background:#f1f3f5;
}

.summary-box{
    background:#f8f9fa;
    border-radius:12px;
    padding:15px;
    border:1px solid #dee2e6;
    text-align:center;
}

.summary-box h5{
    color:#003366;
    margin-bottom:8px;
}

.summary-box h3{
    margin:0;
    color:#28a745;
}

.btn-save{
    background:#28a745;
    border:none;
    padding:12px 35px;
    font-size:16px;
    border-radius:10px;
}

.btn-save:hover{
    background:#218838;
}

.btn-cancel{
    padding:12px 35px;
    border-radius:10px;
}

</style>
</head>

<body>

<div class="container page-container">

<div class="card">

<div class="card-header">

<div>
📦 Material Issue Form
</div>

<div>
<span class="badge-status">
ISSUE PROCESS
</span>
</div>

</div>

<div class="card-body">

<form method="POST">

<!-- Issue Information -->

<div class="section-title">
Issue Information
</div>

<div class="row">

<div class="col-md-3 mb-3">
<label class="form-label">Issue No</label>
<input type="text"
name="issue_no"
class="form-control readonly"
value="{{ issue_no }}"
readonly>
</div>

<div class="col-md-3 mb-3">
<label class="form-label">Issue Date</label>
<input type="text"
name="issue_date"
class="form-control readonly"
value="{{ issue_date }}"
readonly>
</div>

<div class="col-md-3 mb-3">
<label class="form-label">Request No</label>
<input type="text"
name="request_no"
class="form-control"
required>
</div>

<div class="col-md-3 mb-3">
<label class="form-label">Issued By</label>
<input type="text"
name="issued_by"
class="form-control"
required>
</div>

</div>

<!-- Request Information -->

<div class="section-title">
Material Request Information
</div>

<div class="row">

<div class="col-md-4 mb-3">
<label class="form-label">Machine Name</label>
<input type="text"
name="machine_name"
class="form-control"
required>
</div>

<div class="col-md-4 mb-3">
<label class="form-label">Material Type</label>
<select name="material_type"
class="form-select"
required>

<option value="">Select Material</option>
<option>Terminal</option>
<option>Wire</option>
<option>Seal</option>
<option>Tube</option>
<option>Applicator</option>
<option>Tape</option>

</select>
</div>

<div class="col-md-4 mb-3">
<label class="form-label">Part Number</label>
<input type="text"
name="part_no"
class="form-control"
required>
</div>

</div>

<!-- Quantity Section -->

<div class="section-title">
Quantity Details
</div>

<div class="row">

<div class="col-md-3 mb-3">
<label class="form-label">Requested Qty</label>
<input type="number"
id="requested_qty"
name="requested_qty"
class="form-control"
required>
</div>

<div class="col-md-3 mb-3">
<label class="form-label">Issue Qty</label>
<input type="number"
id="issue_qty"
name="issue_qty"
class="form-control"
required
onkeyup="calculateBalance()">
</div>

<div class="col-md-3 mb-3">
<label class="form-label">Balance Qty</label>
<input type="number"
id="balance_qty"
class="form-control readonly"
readonly>
</div>

<div class="col-md-3 mb-3">
<label class="form-label">Current Stock</label>
<input type="number"
class="form-control readonly"
value="0"
readonly>
</div>

</div>

<!-- Summary -->

<div class="row mb-4">

<div class="col-md-4">

<div class="summary-box">
<h5>Requested Qty</h5>
<h3 id="req_display">0</h3>
</div>

</div>

<div class="col-md-4">

<div class="summary-box">
<h5>Issue Qty</h5>
<h3 id="issue_display">0</h3>
</div>

</div>

<div class="col-md-4">

<div class="summary-box">
<h5>Balance Qty</h5>
<h3 id="bal_display">0</h3>
</div>

</div>

</div>

<!-- Remarks -->

<div class="section-title">
Issue Remarks
</div>

<div class="mb-4">

<textarea
class="form-control"
rows="4"
name="remarks"
placeholder="Enter issue remarks here...">
</textarea>

</div>

<!-- Buttons -->

<div class="text-end">

<a href="/store_dashboard"
class="btn btn-secondary btn-cancel">
Cancel
</a>

<button type="submit"
class="btn btn-success btn-save">

✅ Issue Material

</button>

</div>

</form>

</div>

</div>

</div>

<script>

function calculateBalance(){

let req =
parseFloat(document.getElementById("requested_qty").value) || 0;

let issue =
parseFloat(document.getElementById("issue_qty").value) || 0;

let balance = req - issue;

document.getElementById("balance_qty").value = balance;

document.getElementById("req_display").innerHTML = req;

document.getElementById("issue_display").innerHTML = issue;

document.getElementById("bal_display").innerHTML = balance;

}

document.getElementById("requested_qty").addEventListener(
'keyup',
calculateBalance
);

</script>

</body>
</html>
