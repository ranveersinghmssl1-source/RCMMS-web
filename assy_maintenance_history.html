<!DOCTYPE html>
<html>

<head>
<title>ASSY Maintenance History</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f4f6f9;
}

.header{
background:linear-gradient(90deg,#003366,#0078d7);
color:white;
padding:20px;
text-align:center;
}

.container{
width:95%;
margin:auto;
margin-top:20px;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.section-title{
font-size:22px;
color:#003366;
margin-bottom:15px;
border-left:5px solid #0078d7;
padding-left:10px;
}

.search-box{
display:flex;
gap:10px;
margin-bottom:15px;
flex-wrap:wrap;
}

input{
padding:10px;
border:1px solid #ccc;
border-radius:5px;
}

button{
background:#0078d7;
color:white;
border:none;
padding:10px 20px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#005ea6;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

table th{
background:#003366;
color:white;
padding:12px;
border:1px solid #ddd;
}

table td{
padding:10px;
border:1px solid #ddd;
text-align:center;
}

table tr:nth-child(even){
background:#f8f9fa;
}

table tr:hover{
background:#eaf3ff;
}

.open{
color:red;
font-weight:bold;
}

.closed{
color:green;
font-weight:bold;
}

.pending{
color:orange;
font-weight:bold;
}

.back-btn{
text-decoration:none;
background:#198754;
color:white;
padding:10px 20px;
border-radius:5px;
display:inline-block;
margin-bottom:15px;
}

</style>
</head>

<body>

<div class="header">
    <h1>RCMMS ASSY Maintenance History</h1>
</div>

<div class="container">

<a href="/assy_maintenance_action"
class="back-btn">

⬅ Back To Action Form

</a>

<table>

<tr>
<th>Ticket No</th>
<th>Machine</th>
<th>Problem</th>
<th>Technician</th>
<th>Downtime</th>
<th>Status</th>
</tr>

{% for row in history_data %}

<tr>

<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>
<td>{{ row[3] }}</td>
<td>{{ row[4] }}</td>
<td>{{ row[5] }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
