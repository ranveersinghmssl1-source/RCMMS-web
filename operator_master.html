<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCMMS Operator Master</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f4f6f9;
}

.top-bar{
padding:15px 20px;
}

.back-btn{
background:#003366;
color:white;
padding:10px 18px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
display:inline-block;
}

.header{
background:linear-gradient(90deg,#003366,#0078d7);
color:white;
padding:15px;
text-align:center;
}

.container{
width:95%;
margin:auto;
margin-top:15px;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.section-title{
color:#003366;
margin-bottom:15px;
}

.info-card{
background:#eef6ff;
padding:12px;
border-left:5px solid #0078d7;
border-radius:5px;
margin-bottom:15px;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:15px;
}

.field label{
display:block;
font-weight:bold;
margin-bottom:5px;
}

input,select{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:5px;
}

button{
background:#0078d7;
color:white;
border:none;
padding:10px 20px;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#005ea6;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#003366;
color:white;
}

th,td{
padding:10px;
border:1px solid #ddd;
text-align:center;
}

.active{
background:green;
color:white;
padding:4px 10px;
border-radius:4px;
}

.inactive{
background:red;
color:white;
padding:4px 10px;
border-radius:4px;
}

.search-box{
margin:15px 0;
}

.edit-btn{
background:#ffc107;
color:black;
}

.delete-btn{
background:#dc3545;
color:white;
}

</style>
</head>

<body>

<div class="top-bar">
<a href="admin_dashboard.html" class="back-btn">
🏠 Back Dashboard
</a>
</div>

<div class="header">
<h1>👷 RCMMS Operator Master</h1>
</div>

<div class="container">

<div class="info-card">
Manage LPC and ASSY Operator Information
</div>

<h2 class="section-title">
Operator Information
</h2>

<form id="operatorForm">

<div class="row">

<div class="field">
<label>Employee ID</label>
<input type="text" id="employeeId" required>
</div>

<div class="field">
<label>Operator Name</label>
<input type="text" id="operatorName" required>
</div>

</div>

<div class="row">

<div class="field">
<label>Department</label>
<select id="department">
<option>LPC</option>
<option>ASSY</option>
</select>
</div>

<div class="field">
<label>Line Name</label>
<input type="text" id="lineName">
</div>

</div>

<div class="row">

<div class="field">
<label>User Name</label>
<input type="text" id="userName">
</div>

<div class="field">
<label>Password</label>
<input type="password" id="password">
</div>

</div>

<div class="row">

<div class="field">
<label>Shift</label>
<select id="shift">
<option>A Shift</option>
<option>B Shift</option>
<option>C Shift</option>
</select>
</div>

<div class="field">
<label>Status</label>
<select id="status">
<option>ACTIVE</option>
<option>INACTIVE</option>
</select>
</div>

</div>

<button type="submit">
💾 Save Operator
</button>

</form>

<hr style="margin-top:20px;">

<h2 class="section-title">
Operator List
</h2>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="🔍 Search Operator"
onkeyup="searchOperator()">

</div>

<table>

<thead>

<tr>
<th>Employee ID</th>
<th>Name</th>
<th>Department</th>
<th>Line</th>
<th>User</th>
<th>Shift</th>
<th>Status</th>
<th>Edit</th>
<th>Delete</th>
</tr>

</thead>

<tbody id="operatorTableBody">

</tbody>

</table>

</div>

<script>

let operators =
JSON.parse(localStorage.getItem("operators")) || [];

let editIndex = -1;

document
.getElementById("operatorForm")
.addEventListener("submit",function(e){

e.preventDefault();

const operator={

employeeId:employeeId.value,
operatorName:operatorName.value,
department:department.value,
lineName:lineName.value,
userName:userName.value,
password:password.value,
shift:shift.value,
status:status.value

};

if(editIndex==-1){
operators.push(operator);
}
else{
operators[editIndex]=operator;
editIndex=-1;
}

localStorage.setItem(
"operators",
JSON.stringify(operators)
);

this.reset();

loadOperators();

});

function loadOperators(){

const tbody =
document.getElementById(
"operatorTableBody"
);

tbody.innerHTML="";

operators.forEach((o,index)=>{

let cls =
o.status==="ACTIVE"
? "active"
: "inactive";

tbody.innerHTML += `

<tr>

<td>${o.employeeId}</td>
<td>${o.operatorName}</td>
<td>${o.department}</td>
<td>${o.lineName}</td>
<td>${o.userName}</td>
<td>${o.shift}</td>

<td>
<span class="${cls}">
${o.status}
</span>
</td>

<td>
<button
class="edit-btn"
onclick="editOperator(${index})">
Edit
</button>
</td>

<td>
<button
class="delete-btn"
onclick="deleteOperator(${index})">
Delete
</button>
</td>

</tr>

`;

});

}

function editOperator(index){

const o = operators[index];

employeeId.value=o.employeeId;
operatorName.value=o.operatorName;
department.value=o.department;
lineName.value=o.lineName;
userName.value=o.userName;
password.value=o.password;
shift.value=o.shift;
status.value=o.status;

editIndex=index;

}

function deleteOperator(index){

if(confirm("Delete Operator ?")){

operators.splice(index,1);

localStorage.setItem(
"operators",
JSON.stringify(operators)
);

loadOperators();

}

}

function searchOperator(){

let value =
document
.getElementById("searchInput")
.value
.toLowerCase();

let rows =
document.querySelectorAll(
"#operatorTableBody tr"
);

rows.forEach(row=>{

row.style.display =
row.innerText.toLowerCase()
.includes(value)
? ""
: "none";

});

}

loadOperators();

</script>

</body>
</html>
